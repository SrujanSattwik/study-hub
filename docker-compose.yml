version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyhub-postgres
    restart: always
    environment:
      POSTGRES_USER: study_hub_user
      POSTGRES_PASSWORD: study_hub_password
      POSTGRES_DB: study_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_hub_user -d study_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyhub-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://study_hub_user:study_hub_password@postgres:5432/study_hub?schema=public"
      JWT_SECRET: "production-super-secret-jwt-key-studyhub-v1"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
